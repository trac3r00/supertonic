[project]
name = "supertonic-runtime-local"
version = "1.0.0"
description = "Locally installable Supertonic ONNX runtime compatibility SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26.0"]

[project.optional-dependencies]
cpu = ["onnxruntime==1.23.1"]
cuda = ["onnxruntime-gpu==1.23.2"]
serve = ["supertonic==1.3.1", "onnxruntime==1.23.1"]
dev = ["basedpyright>=1.34.0", "pytest>=8.0.0", "ruff>=0.12.0"]

[project.scripts]
supertonic-runtime = "supertonic_runtime.cli:main"

[tool.setuptools]
py-modules = ["helper"]

[tool.setuptools.packages.find]
include = ["supertonic_runtime*"]

[tool.uv]
conflicts = [
  [{ extra = "cpu" }, { extra = "cuda" }],
  [{ extra = "serve" }, { extra = "cuda" }],
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
include = [
  "supertonic_runtime/__init__.py",
  "supertonic_runtime/cli.py",
  "supertonic_runtime/errors.py",
  "supertonic_runtime/types.py",
  "tests/test_package.py",
]
typeCheckingMode = "standard"
reportMissingImports = "error"
